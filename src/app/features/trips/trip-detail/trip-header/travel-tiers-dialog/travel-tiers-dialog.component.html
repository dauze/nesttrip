<div class="travel-tiers-dialog flex flex-column" [formGroup]="form">
  <div class="travel-tiers-dialog__row flex align-items-center justify-content-between gap-2 flex-shrink-0">
    <span class="travel-tiers-dialog__title">Moyen de transport</span>
    <app-button
      icon="pi pi-times"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      class="flex-shrink-0"
      aria-label="Fermer"
      (click)="cancel()" />
  </div>

  <div class="travel-tiers-dialog__body">
    <app-paliers-trajet-slider
      [min]="0"
      [max]="maxKm"
      [step]="1"
      [tier1Value]="tier1Km()"
      [tier2Value]="tier2Km()"
      (tier1ValueChange)="form.patchValue({ tier1MaxKm: $event })"
      (tier2ValueChange)="form.patchValue({ tier2MaxKm: $event })">
      <app-select tier1-mode class="tier-select" formControlName="tier1Mode" [options]="modeOptions" label="Moyen de transport 1" />
      <app-select tier2-mode class="tier-select" formControlName="tier2Mode" [options]="modeOptions" label="Moyen de transport 2" />
      <app-select tier3-mode class="tier-select" formControlName="tier3Mode" [options]="modeOptions" label="Moyen de transport 3" />
    </app-paliers-trajet-slider>
  </div>

  <div class="travel-tiers-dialog__footer nt-footer-actions align-items-center justify-content-end flex-shrink-0">
    <app-button
      label="Annuler"
      [outlined]="!viewport.isMobile()"
      severity="secondary"
      [size]="viewport.isMobile() ? 'large' : 'normal'"
      (click)="cancel()" />
    <app-button label="OK" [size]="viewport.isMobile() ? 'large' : 'normal'" (click)="validate()" />
  </div>
</div>
