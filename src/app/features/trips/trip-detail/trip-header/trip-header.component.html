<app-card>
  <div cardHeader class="flex align-items-center justify-content-between px-2 pt-3">
    <div class="flex align-items-center gap-1 flex-1 min-w-0">
      <span class="text-xl font-semibold white-space-nowrap overflow-hidden text-overflow-ellipsis">{{ title() }}</span>
      <button type="button" class="trip-header__pencil flex-shrink-0" aria-label="Modifier le titre" (click)="openTitleDialog()">
        <i class="pi pi-pencil"></i>
      </button>
    </div>
    <ng-content select="[trip-actions]" />
  </div>

  <div class="flex align-items-center gap-1">
    <span class="text-sm flex-shrink-0">Date : {{ dateRangeLabel() }}</span>
    <button type="button" class="trip-header__pencil flex-shrink-0" aria-label="Modifier les dates" (click)="openDatePicker()">
      <i class="pi pi-pencil"></i>
    </button>
  </div>

  <form [formGroup]="dateForm" class="trip-header__hidden-date-picker">
    <app-date-picker
      inputId="dates"
      formControlName="dates"
      [range]="true"
      (selected)="onDatesSelected()"
    />
  </form>
</app-card>
