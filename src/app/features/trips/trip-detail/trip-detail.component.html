<div class="flex flex-column trip-detail-root">
  @if (facade.activeTrip(); as trip) {
    <div  class="flex flex-column" [class.invisible-content]="!contentReady()">
      <div
        #headerWrapper
        class="app-trip-header-fixed"
        [style.top.px]="chromeService.headerTop()">
        <app-trip-header
          [trip]="trip"
          [title]="tripTitle()"
          [currency]="facade.getTripCurrency(trip.id)()"
          (titleChange)="onTitleChange($event)"
          (datesChange)="onDatesChange($event)"
          (currencyChange)="onCurrencyChange($event)">
          <app-trip-collaborators
            trip-actions
            [tripId]="trip.id" />
        </app-trip-header>
      </div>

      <!-- Layout scindé (desktop / mobile paysage, voir ViewportService) :
           la barre des jours passe sticky juste sous toolbar+header au lieu
           de flotter en bas (décision produit, voir ROADMAP.md "UI Desktop"). -->
      <!-- `class.top-0` n'est PAS utilisable ici : l'utilitaire `.top-0` pose
           `top: 0 !important` (layout-utilities.scss), qui écraserait la
           valeur dynamique posée juste en dessous par `[style.top.px]`. -->
      <app-trip-tabs-nav
        class="fixed app-trip-tabs-nav-fixed z-5"
        [class.bottom-0]="!viewport.isSplitLayout()"
        [style.top.px]="viewport.isSplitLayout() ? chromeService.tabsNavTop() : null"
        [tabs]="tabs()"
        [activeId]="activeDay()"
        (tabSelected)="onTabSelected($event)" />

      <app-trip-day-swiper
        [trip]="trip"
        [tabs]="tabs()"
        [activeId]="activeDay()"
        (activeIdChange)="onSwiperActiveIdChange($event)"
        (ready)="onSwiperReady()" />

      <!-- Hors du swiper de jours (voir FloatingAddButtonComponent) : un
           ancêtre `swiper-slide` applique un transform permanent, ce qui
           casserait le `position:fixed` de ce bouton. Masqué pendant le mode
           sélection (voir app-selection-action-bar juste en dessous), qui
           recouvre de toute façon la barre des jours à cet endroit. -->
      @if (!selectionService.active()) {
        <app-floating-add-button
          [icon]="fabIcon()"
          [badge]="true"
          [ariaLabel]="fabAriaLabel()"
          [bottomOffset]="chromeService.tabsNavBottomReserve() + chromeService.generalSubTabBarHeight()"
          (activate)="onFabActivate()" />
      }

      <!-- Même contrainte hors-swiper, uniquement sur l'onglet "Général" (voir
           GeneralSubTabBarComponent) — masqué pendant le mode sélection pour
           la même raison que le "+" flottant ci-dessus. -->
      @if (activeDay() === 'notes' && !selectionService.active()) {
        <app-general-sub-tab-bar [bottomOffset]="chromeService.tabsNavBottomReserve()" />
      }

      <!-- Même contrainte hors-swiper que le "+" flottant ci-dessus. -->
      <app-selection-action-bar
        [count]="selectionService.selectedCount()"
        [minHeight]="chromeService.tabsNavBottomReserve()"
        (cancelSelection)="onSelectionCancel()"
        (deleteSelected)="onSelectionDelete()" />
    </div>
  }

  @if (facade.activeTripLoading() || !contentReady()) {
    <app-trip-detail-skeleton class="skeleton-overlay"/>
  }

  <app-activity-day-dispatch-overlay [days]="sortedDays()" [tabs]="tabs()" [activeDayId]="activeDay()" />

  <!-- Voir ActivityDispatchService.registerDragPortal : point d'ancrage hors du
       swiper de jours (dont un ancêtre `swiper-slide` applique transform/filter,
       ce qui casserait le position:fixed) pour le CLONE qui suit le doigt
       pendant un réordonnancement intra-jour (DayPanelComponent.beginCardFollow). -->
  <div #dragPortal class="drag-portal-anchor"></div>
</div>
