<div class="flex flex-column trip-detail-root">
  @if (facade.activeTrip(); as trip) {
    <div  class="flex flex-column" [class.invisible-content]="!contentReady()">
      <!-- Vrai desktop (pointeur fin, voir ViewportService.isMobileChrome) :
           la barre des jours reste sticky juste sous la toolbar, comme avant
           (décision produit, voir ROADMAP.md "UI Desktop"). Les 4 tabs
           Général mobiles y sont regroupés en un seul "Général"
           (desktopNavTabs/desktopNavActiveId, voir TripDetailComponent) —
           TripGeneralDesktopComponent ci-dessous les affiche tous les 3 en
           même temps, plus besoin d'y naviguer un par un. Mobile (portrait OU
           paysage tactile) : barre morphing bas d'écran INCHANGÉE, voir
           MobileTripNavComponent (ROADMAP.md "UX / Interactions"). -->
      @if (!viewport.isMobileChrome()) {
        <app-trip-tabs-nav
          class="fixed app-trip-tabs-nav-fixed z-5"
          [style.top.px]="chromeService.tabsNavTop()"
          [tabs]="desktopNavTabs()"
          [activeId]="desktopNavActiveId()"
          (tabSelected)="onTabSelected($event)" />
      } @else {
        <app-mobile-trip-nav
          [tabs]="tabs()"
          [activeId]="activeDay()"
          (tabSelected)="onTabSelected($event)" />
      }

      <!-- Carte Google Maps PARTAGÉE, hôte unique de tout le trip (refonte
           desktop/mobile, option B) : l'instance est créée une seule fois ici
           et jamais recréée tant que le trip est ouvert — ni mobile ni desktop
           ne la possèdent, ils ne font que la RÉCLAMER via
           TripDayMapHostService. Déclarée hors du Swiper (contrairement à
           avant) pour qu'elle survive à son démontage en desktop. Toujours
           montée (jamais un @if) : `.map-anchor` sert d'ancre neutre de repli
           (voir mapAnchorRef / registerDefaultAnchor). -->
      <div class="map-anchor" #mapAnchor>
        <app-trip-day-map #dayMap></app-trip-day-map>
      </div>

      <!-- Conteneur `position:fixed` "carte jour" hors du scroll (layout
           empilé/mobile UNIQUEMENT — DayPanelComponent y déplace la carte via
           TripDayMapHostService.dayFixedContainer). En layout scindé (desktop,
           carte en colonne) ce conteneur reste vide (0 hauteur) :
           DayPanelComponent cible alors son propre `.sticky-map`. Remonté ici
           depuis le Swiper avec la carte. -->
      <div
        #dayFixedMap
        class="day-fixed-map"
        [class.day-fixed-map--active]="mapHost.dayFixedContainerHeight() > 0"
        [style.--chrome-toolbar-height.px]="chromeService.toolbarHeight()"
      ></div>

      <!-- Isolation totale des deux modes (option B) :
           - Mobile : le Swiper est le SEUL rendu (inchangé), slides
             scrollables, barre des jours en bas. Un vrai `@if` (plus un
             `[hidden]`) : en desktop il est réellement démonté du DOM, donc
             plus de slides fantômes qui captent le scroll de l'écran.
           - Desktop : le Swiper disparaît, TripDetailDesktopComponent rend un
             scrollport UNIQUE sous la barre des jours — la grille Général OU
             la vue Jour du jour actif (changement de jour par la barre, plus
             de swipe horizontal, sans objet à la souris). -->
      @if (viewport.isMobileChrome()) {
        <app-trip-day-swiper
          [trip]="trip"
          [tabs]="tabs()"
          [activeId]="activeDay()"
          (activeIdChange)="onSwiperActiveIdChange($event)"
          (ready)="onSwiperReady()" />
      } @else {
        <app-trip-detail-desktop
          [trip]="trip"
          [activeDay]="activeDay()"
          [isGeneralActive]="isGeneralActive()"
          (ready)="onSwiperReady()" />
      }

      <!-- Ancre synthétique du tour de navigation (voir onboarding-sequences.ts,
           steps ciblant 'content-area') : pas un élément visuel, juste une zone
           mesurable représentant "tout l'écran sauf la toolbar et la barre de nav
           mobile", recalculée en continu à partir des hauteurs de chrome mesurées
           (TripChromeService), sans dupliquer leur logique ici. -->
      <div
        class="onboarding-content-anchor"
        appOnboardingAnchor="content-area"
        [style.top.px]="chromeService.toolbarHeight()"
        [style.bottom.px]="chromeService.tabsNavBottomReserve()"
      ></div>

      <!-- Hors du swiper de jours (voir FloatingAddButtonComponent) : un
           ancêtre `swiper-slide` applique un transform permanent, ce qui
           casserait le `position:fixed` de ce bouton. Masqué pendant le mode
           sélection (voir app-selection-action-bar juste en dessous), qui
           recouvre de toute façon la barre des jours à cet endroit. -->
      @if (!selectionService.active()) {
        <app-floating-add-button
          [icon]="fabIcon()"
          [ariaLabel]="fabAriaLabel()"
          [bottomOffset]="chromeService.tabsNavBottomReserve()"
          [avoidEdge]="fabTarget.avoidEdge()"
          (activate)="onFabActivate()" />
      }
      <app-menu #addMenu title="Ajouter" [items]="addMenuItems()" />
      <app-menu #logisticsAddMenu title="Type" [items]="logisticsAddMenuItems()" />

      <!-- Même contrainte hors-swiper que le "+" flottant ci-dessus. -->
      <app-selection-action-bar
        [count]="selectionService.selectedCount()"
        [minHeight]="chromeService.tabsNavBottomReserve()"
        (cancelSelection)="onSelectionCancel()"
        (deleteSelected)="onSelectionDelete()" />
    </div>
  }

  @if (facade.activeTripLoading() || !contentReady()) {
    <app-trip-detail-skeleton class="skeleton-overlay"/>
  }

  <app-activity-day-dispatch-overlay [days]="sortedDays()" [activeDayId]="activeDay()" />

  <!-- Tour de navigation (src/specs/Parcours-new-user.md, étape 3) : mobile uniquement, voir la doc de OnboardingTourService/CoachMarkOverlayComponent. -->
  @if (viewport.isMobileChrome()) {
    <app-coach-mark-overlay />
  }

  <!-- Voir ActivityDispatchService.registerDragPortal : point d'ancrage hors du
       swiper de jours (dont un ancêtre `swiper-slide` applique transform/filter,
       ce qui casserait le position:fixed) pour le CLONE qui suit le doigt
       pendant un réordonnancement intra-jour (DayPanelComponent.beginCardFollow). -->
  <div #dragPortal class="drag-portal-anchor"></div>
</div>
