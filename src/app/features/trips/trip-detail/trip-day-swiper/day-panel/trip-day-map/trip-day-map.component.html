<app-panel
    class="map-panel pull-to-refresh-exclude"
    [toggleable]="mapHost.currentOwner() !== 'general' && !viewport.isSplitLayout()"
    [footerToggle]="mapHost.currentOwner() !== 'general' && !viewport.isSplitLayout()"
    [bare]="mapHost.currentOwner() === 'general'"
    [noHeader]="viewport.isSplitLayout()"
    [(collapsed)]="collapsed"
    [dragPullPx]="dragPullPx()"
    (afterToggle)="onCollapsedToggled($event)"
    [fillHeight]="useSplitHeight()">
    <div class="flex flex-column gap-2 swiper-no-swiping map-container"
      [class.map-container--fill]="useSplitHeight()">
      <!--
        @for à un seul élément, tracké par isDarkMode() : google.maps.Map ne
        rafraîchit pas visuellement son rendu quand `colorScheme` change via
        setOptions() sur une carte déjà créée (limitation constatée de l'API,
        voir ROADMAP.md — le thème carte ne s'appliquait qu'après un F5).
        Recréer tout le sous-arbre (donc la vraie instance Map) à chaque
        bascule clair/sombre force un nouveau rendu correct dès la création.
      -->
      @for (darkMode of [isDarkMode()]; track darkMode) {
        <google-map
          [height]="useSplitHeight() ? '100%' : '32dvh'"
          width="100%"
          [center]="center()"
          [zoom]="zoom()"
          [options]="mapOptions()"
        >
          @for (point of points(); track point.activityId) {
            <map-advanced-marker
              [position]="{ lat: point.latitude, lng: point.longitude }"
              [title]="point.name"
              [content]="markerContent(point)"
              (markerInitialized)="onMarkerInitialized($event, point)"
            />
          }
        </google-map>
      }
  </div>

  <!--
    Footer togglable (poignée "pi-map" + grabber) RÉSERVÉ au layout empilé
    (mobile) : en layout scindé (desktop) le repli de la carte passe par le
    bouton "Réduire la carte" de DayPanelComponent (voir day-panel.component.html),
    ce footer y faisait doublon (retour utilisateur) — d'où l'exclusion
    `!viewport.isSplitLayout()`, identique à celle du `footerToggle` ci-dessus.
  -->
  @if (mapHost.currentOwner() !== 'general' && !viewport.isSplitLayout()) {
    <div
      #grabberFooter
      panelFooter
      class="map-panel__footer-icons flex flex-column align-items-center"
      (pointerdown)="onGrabberPointerDown($event)">
      <i class="pi pi-map"></i>
      <span class="map-panel__grabber"></span>
    </div>
  }
</app-panel>
