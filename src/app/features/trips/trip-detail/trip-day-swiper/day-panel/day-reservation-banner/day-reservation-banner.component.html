@if (occurrences().length > 0) {
  <div class="day-reservation-banner flex flex-column gap-2 mb-2">
    @for (occurrence of occurrences(); track occurrence.reservation.id + occurrence.role) {
      <button
        type="button"
        class="day-reservation-banner__item flex align-items-center gap-2 w-full"
        (click)="onTap(occurrence.reservation.id)">
        <i [class]="typeMeta[occurrence.reservation.type].icon + ' text-lg flex-shrink-0'"></i>
        <span class="day-reservation-banner__role flex-shrink-0 text-sm font-semibold">{{ occurrence.role }}</span>
        <span class="day-reservation-banner__title flex-1 min-w-0 text-sm white-space-nowrap overflow-hidden text-overflow-ellipsis">
          {{ occurrence.reservation.title }}
        </span>
        <span class="nt-text-muted text-sm flex-shrink-0">{{ occurrence.time | date:'HH:mm' }}</span>
      </button>
    }
  </div>
}
