@if (loading() || hasRoute()) {
  <div class="day-distance-gap-rail justify-content-center">
    <div class="day-distance-gap-rail__line" aria-hidden="true"></div>

    <div class="py-2 gap-2">
      <div class="flex align-items-center gap-2">
      <app-chip [removable]="false" class="nt-bg-subtle text-sm cursor-pointer">
        <button
          #pictogram
          type="button"
          class="day-distance-gap-chip__chevron"
          [attr.aria-label]="pictogramAriaLabel()"
          (click)="onPictogramClick()">
          <div class="flex align-items-center justify-content-center gap-2">
            @if (mode() === 'walk') {
              <svg class="day-distance-gap-chip__mode-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="4.5" r="2" fill="currentColor" />
                <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 8v5" />
                  <path d="M12 13l-3 7" />
                  <path d="M12 13l3.5 3.5-1 4" />
                  <path d="M12 9.5l-3.5 2.5" />
                  <path d="M12 9.5l3 1.5" />
                </g>
              </svg>
            } @else if (mode() === 'bike') {
              <svg class="day-distance-gap-chip__mode-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="5.5" cy="17.5" r="3.5" />
                  <circle cx="18.5" cy="17.5" r="3.5" />
                  <path d="M5.5 17.5 9.5 9h4l3.5 8.5" />
                  <path d="M9.5 9 8 6h-1.5" />
                  <path d="M9.5 9l3 4.5h4" />
                </g>
              </svg>
            } @else if (mode() === 'car') {
              <i class="pi pi-car day-distance-gap-chip__mode-icon" aria-hidden="true"></i>
            } @else {
              <i class="pi nt-icon-train day-distance-gap-chip__mode-icon" aria-hidden="true"></i>
            }
            {{ modeLibelle() }}
            <i class="pi pi-chevron-down" aria-hidden="true"></i>
          </div>
        </button>
      </app-chip>
      <app-chip [removable]="false" class="text-sm cursor-pointer">
        <a
          class="day-distance-gap-chip__main flex align-items-center gap-1 text-xs no-underline white-space-nowrap"
          [href]="mapsUrl()"
          target="_blank"
          rel="noopener"
          [attr.aria-label]="loading() ? 'Ouvrir l\'itinéraire dans Google Maps' : ariaLabel()">
          <svg class="day-distance-gap-chip__route-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="4.5" cy="19.5" r="2" fill="currentColor" />
            <path d="M6 18C10 13 9 9 13 8s2-5 6-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="0.1 3.2" />
            <path d="M19 2a3 3 0 0 0-3 3c0 2.2 3 5.5 3 5.5s3-3.3 3-5.5a3 3 0 0 0-3-3Z" fill="currentColor" />
          </svg>
          @if (loading()) {
            <app-skeleton width="4.5rem" height="0.65rem" borderRadius="var(--nt-radius-pill)" />
          } @else {
            <span class="day-distance-gap-chip__label">{{ distanceLabel() }} · {{ durationMinutes() | duration }}</span>
          }
        </a>
      </app-chip>
      </div>
    @if (showTransportCta()) {
      <div class="pt-2">
      <button
        #transportCta
        type="button"
        class="day-distance-gap-rail__transport-cta flex align-items-center justify-content-center gap-1 text-xs cursor-pointer"
        (click)="onTransportCtaClick()">
        <i class="pi pi-plus-circle" aria-hidden="true"></i>
        Enregistrer un transport ?
      </button>
      </div>
    }
    </div>
  </div>

  <app-menu #modeMenu [items]="modeMenuItems()" />
  @if (showTransportCta()) {
    <app-menu #transportMenu [items]="transportMenuItems()" />
  }
}
