<div class="general-panel-root flex flex-column gap-2" [class.general-panel-root--activities]="activeSubTab()==='activities'">
  <div class="w-full sub-tab-switch" #subTabSwitch>
    <app-select-button
      [options]="subTabOptions"
      [value]="activeSubTab()"
      (valueChange)="selectSubTab($event)"
    />
  </div>
  <div>
    @switch (activeSubTab()) {
      @case ('notes') {
        <app-notes [notes]="notes()" [tripId]="tripId()" />
      }
      @case ('reservations') {
        <app-reservations-list [tripId]="tripId()" />
      }
      @default {
        <app-trip-activities [tripId]="tripId()" [active]="active()" />
      }
    }
  </div>
</div>
