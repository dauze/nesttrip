<div class="new-reservation-draft flex align-items-center gap-2 w-full min-w-0">
  <div class="new-reservation-draft__thumb flex-shrink-0 border-round overflow-hidden nt-bg-subtle flex align-items-center justify-content-center">
    <i class="pi pi-bookmark text-xl nt-text-muted"></i>
  </div>

  <input
    #titleInput
    type="text"
    class="nt-inline-field w-full font-semibold text-base"
    placeholder="Nom de la réservation"
    (blur)="onBlur($any($event.target).value)"
    (keydown.enter)="onEnter($any($event.target).value)" />
</div>
