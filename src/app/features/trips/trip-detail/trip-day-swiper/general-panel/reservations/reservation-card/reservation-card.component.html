@if (reservation(); as reservation) {
  <div #cardContainer>
    <app-panel
        [appSelectable]="selectableRef()" #sel="appSelectable"
        appLongPress (longPress)="sel.onLongPress()"
        [ngClass]="'booking ' + bookingMeta().className + (timeStatus() === 'past' ? ' reservation-past' : '') + (timeStatus() === 'undated' ? ' reservation-undated' : '')" [toggleable]="true" [(collapsed)]="collapsed">
      <div panelHeader class="flex align-items-center w-full">
        <app-checkbox
          class="nt-select-checkbox flex-shrink-0"
          [checked]="sel.isSelected()"
          (click)="sel.onCheckboxClick($event)"
        />
        <app-reservation-header class="flex-1 min-w-0" [reservation]="reservation" (titleEdited)="onTitleChanged($event)" />
        @if (timeStatus() === 'current') {
          <app-tag severity="success" value="En cours" class="flex-shrink-0" />
        }
      </div>

      <app-reservation-details #details [tripId]="tripId()" [reservation]="reservation" />
      <app-divider class="m-1" />
      <app-reservation-files [tripId]="tripId()" [reservation]="reservation" />
    </app-panel>
  </div>
}
