<form [formGroup]="form" class="reservation-details compact-form flex flex-column gap-2">
  <div class="grid m-0">
    <div class="col-6 p-0 pr-1 min-w-0">
      <div class="flex flex-column gap-1 w-full min-w-0">
        <label for="reservation-type" class="nt-text-muted text-sm flex align-items-center gap-1">
          <i class="pi pi-list text-sm"></i>Type
        </label>
        <app-select id="reservation-type" [options]="typeOptions" formControlName="type" class="w-full transparent-select" />
      </div>
    </div>
    <div class="col-6 p-0 pl-1 min-w-0" formGroupName="booking">
      <div class="flex flex-column gap-1 w-full min-w-0">
        <label for="reservation-booking-status" class="nt-text-muted text-sm flex align-items-center gap-1">
          <i class="pi pi-bookmark text-sm"></i>Résa
        </label>
        <app-select id="reservation-booking-status" [ngClass]="'booking ' + bookingMeta().className" [options]="bookingStatusOptions" formControlName="status" class="w-full min-w-0 transparent-select" />
      </div>
    </div>
  </div>

  @switch (selectedType()) {
    @case ('hotel') {
      <app-hotel-fields [initialPlace]="currentPlaces().place" (placeSelected)="onPlaceSelected('place', $event)" />
      <app-reservation-place-info [place]="currentPlaces().place" />
    }
    @case ('flight') {
      <div class="grid m-0">
        <div class="col-6 p-0 pr-1 min-w-0">
          <div class="flex flex-column gap-1 w-full min-w-0">
            <label for="reservation-airline" class="nt-text-muted text-sm flex align-items-center gap-1">
              <i class="pi pi-tag text-sm"></i>Compagnie
            </label>
            <input id="reservation-airline" type="text" formControlName="airline" placeholder="Air France" class="nt-inline-field w-full" />
          </div>
        </div>
        <div class="col-6 p-0 pl-1 min-w-0">
          <div class="flex flex-column gap-1 w-full min-w-0">
            <label for="reservation-flight-number" class="nt-text-muted text-sm flex align-items-center gap-1">
              <i class="pi pi-hashtag text-sm"></i>N° de vol
            </label>
            <input id="reservation-flight-number" type="text" formControlName="flightNumber" placeholder="AF1234" class="nt-inline-field w-full" />
          </div>
        </div>
      </div>
      <app-flight-fields
        [initialDepartureAirport]="currentPlaces().departureAirport"
        [initialArrivalAirport]="currentPlaces().arrivalAirport"
        (departureAirportSelected)="onPlaceSelected('departureAirport', $event)"
        (arrivalAirportSelected)="onPlaceSelected('arrivalAirport', $event)" />
      <app-reservation-place-info [place]="currentPlaces().departureAirport" />
      <app-reservation-place-info [place]="currentPlaces().arrivalAirport" />
      @if (reservation(); as r) {
        @if (r.type === 'flight' && r.flightNumber) {
          <app-flight-status-badge [tripId]="tripId()" [reservation]="r" />
        }
      }
    }
    @case ('carRental') {
      <div class="flex flex-column gap-1 w-full min-w-0">
        <label for="reservation-company" class="nt-text-muted text-sm flex align-items-center gap-1">
          <i class="pi pi-tag text-sm"></i>Loueur
        </label>
        <input id="reservation-company" type="text" formControlName="company" placeholder="Hertz, Europcar..." class="nt-inline-field w-full" />
      </div>
      <app-car-rental-fields
        [initialPickupPlace]="currentPlaces().pickupPlace"
        [initialDropoffPlace]="currentPlaces().dropoffPlace"
        (pickupPlaceSelected)="onPlaceSelected('pickupPlace', $event)"
        (dropoffPlaceSelected)="onPlaceSelected('dropoffPlace', $event)" />
      <app-reservation-place-info [place]="currentPlaces().pickupPlace" />
      <app-reservation-place-info [place]="currentPlaces().dropoffPlace" />
    }
    @case ('other') {
      <app-generic-fields [initialPlace]="currentPlaces().place" (placeSelected)="onPlaceSelected('place', $event)" />
      <app-reservation-place-info [place]="currentPlaces().place" />
    }
  }

  <app-divider class="m-1" />

  <div class="grid m-0">
    <div class="col-6 p-0 pr-1 min-w-0">
      <div class="flex flex-column gap-1">
        <label for="reservation-start-date" class="reservation-details__date-label nt-text-muted text-sm flex align-items-end gap-1">
          <i class="pi pi-calendar text-sm"></i>{{ dateLabels().startLabel }}
        </label>
        <div class="flex align-items-center gap-1">
          <app-date-picker inputId="reservation-start-date" formControlName="startDate" class="flex-1 min-w-0 transparent-inputtext" />
          <app-time-picker-dialog formControlName="startTime" class="flex-none" />
        </div>
      </div>
    </div>
    <div class="col-6 p-0 pl-1 min-w-0">
      <div class="flex flex-column gap-1">
        <label for="reservation-end-date" class="reservation-details__date-label nt-text-muted text-sm flex align-items-end gap-1">
          <i class="pi pi-calendar-times text-sm"></i>{{ dateLabels().endLabel }}
        </label>
        <div class="flex align-items-center gap-1">
          <app-date-picker inputId="reservation-end-date" formControlName="endDate" class="flex-1 min-w-0 transparent-inputtext" />
          <app-time-picker-dialog formControlName="endTime" class="flex-none" />
        </div>
      </div>
    </div>
  </div>

  <div class="flex flex-column gap-1" formGroupName="price">
    <label for="reservation-price-amount" class="nt-text-muted text-sm flex align-items-center gap-1">
      <i class="pi pi-euro text-sm"></i>Prix
    </label>
    <div class="flex align-items-center gap-1 w-full min-w-0">
      <app-input-number inputId="reservation-price-amount" formControlName="amount" class="flex-1 min-w-0 transparent-inputtext" inputClass="w-full text-sm" />
      <app-select [options]="currencyOptions" formControlName="currency" class="flex-none w-max transparent-select" />
    </div>
  </div>

  @if (showDeadline()) {
    <div class="flex flex-column gap-1 w-full min-w-0" formGroupName="booking">
      <label for="reservation-booking-deadline" class="text-xs flex align-items-center gap-1" [ngClass]="isDeadlineSoon() ? 'text-orange-500' : 'nt-text-muted'">
        <i class="pi pi-calendar text-xs"></i>Deadline
      </label>
      <app-date-picker inputId="reservation-booking-deadline" formControlName="deadline" placeholder="Aucune deadline" class="w-max transparent-inputtext" />
    </div>
  }

  <app-divider class="m-1" />

  <div class="flex flex-column gap-2">
    <label for="reservation-notes" class="nt-text-muted text-sm flex align-items-center gap-1">
      <i class="pi pi-align-left text-xs"></i>Notes
    </label>
    <textarea id="reservation-notes" appTextarea formControlName="notes" placeholder="Ajouter une note…" rows="2" class="w-full"></textarea>
  </div>
</form>
