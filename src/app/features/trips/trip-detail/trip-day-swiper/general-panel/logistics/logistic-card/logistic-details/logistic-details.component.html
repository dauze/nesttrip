<form [formGroup]="form" class="logistic-details compact-form flex flex-column gap-1">
  <div class="grid m-0">
    <div class="col-6 p-0 pr-1 min-w-0">
      <div class="flex flex-column gap-1 w-full min-w-0">
        <label for="logistic-type" class="nt-text-muted text-sm flex align-items-center gap-1">
          <i class="pi pi-list text-sm"></i>Type
        </label>
        <app-select id="logistic-type" label="Type" class="booking w-full transparent-select" [style.--booking-status-color]="'var(' + typeColorVar() + ')'" [options]="typeOptions" formControlName="type" />
      </div>
    </div>
    <div class="col-6 p-0 pl-1 min-w-0" formGroupName="booking">
      <div class="flex flex-column gap-1 w-full min-w-0">
        <label for="logistic-booking-status" class="nt-text-muted text-sm flex align-items-center gap-1">
          <i class="pi pi-bookmark text-sm"></i>Résa
        </label>
        <app-select #bookingSelect id="logistic-booking-status" label="Résa" [options]="bookingStatusOptions" formControlName="status" class="w-full min-w-0 transparent-select" />
      </div>
    </div>
  </div>

  <app-divider class="m-1" />

  @switch (selectedType()) {
    @case ('logement') {
      <app-logistic-place-info [place]="currentPlaces().place" />
    }
    @case ('flight') {
      <div class="grid m-0">
        <div class="col-6 p-0 pr-1 min-w-0">
          <div class="flex flex-column gap-1 w-full min-w-0">
            <label for="logistic-airline" class="nt-text-muted text-sm flex align-items-center gap-1">
              <i class="pi pi-tag text-sm"></i>Compagnie
            </label>
            <input id="logistic-airline" type="text" formControlName="airline" placeholder="Air France" class="nt-inline-field w-full" />
          </div>
        </div>
        <div class="col-6 p-0 pl-1 min-w-0">
          <div class="flex flex-column gap-1 w-full min-w-0">
            <label for="logistic-flight-number" class="nt-text-muted text-sm flex align-items-center gap-1">
              <i class="pi pi-hashtag text-sm"></i>N° de vol
            </label>
            <input id="logistic-flight-number" type="text" formControlName="flightNumber" placeholder="AF1234" class="nt-inline-field w-full" />
          </div>
        </div>
      </div>
      <app-flight-fields
        [initialDepartureAirport]="currentPlaces().departureAirport"
        [initialArrivalAirport]="currentPlaces().arrivalAirport"
        (departureAirportSelected)="onPlaceSelected('departureAirport', $event)"
        (arrivalAirportSelected)="onPlaceSelected('arrivalAirport', $event)" />
      <app-logistic-place-info [place]="currentPlaces().departureAirport" />
      <app-logistic-place-info [place]="currentPlaces().arrivalAirport" />
      @if (logistic(); as r) {
        @if (r.type === 'flight' && r.flightNumber) {
          <app-flight-status-badge [tripId]="tripId()" [logistic]="r" />
        }
      }
    }
    @case ('carRental') {
      <div class="flex flex-column gap-1 w-full min-w-0">
        <label for="logistic-company" class="nt-text-muted text-sm flex align-items-center gap-1">
          <i class="pi pi-tag text-sm"></i>Loueur
        </label>
        <input id="logistic-company" type="text" formControlName="company" placeholder="Hertz, Europcar..." class="nt-inline-field w-full" />
      </div>
      <app-car-rental-fields
        [initialPickupPlace]="currentPlaces().pickupPlace"
        [initialDropoffPlace]="currentPlaces().dropoffPlace"
        (pickupPlaceSelected)="onPlaceSelected('pickupPlace', $event)"
        (dropoffPlaceSelected)="onPlaceSelected('dropoffPlace', $event)" />
      <app-logistic-place-info [place]="currentPlaces().pickupPlace" />
      <app-logistic-place-info [place]="currentPlaces().dropoffPlace" />
    }
    @case ('train') {
      <app-train-fields
        [initialDeparturePlace]="currentPlaces().departurePlace"
        [initialArrivalPlace]="currentPlaces().arrivalPlace"
        (departurePlaceSelected)="onPlaceSelected('departurePlace', $event)"
        (arrivalPlaceSelected)="onPlaceSelected('arrivalPlace', $event)" />
      <app-logistic-place-info [place]="currentPlaces().departurePlace" />
      <app-logistic-place-info [place]="currentPlaces().arrivalPlace" />
    }
    @case ('other') {
      <app-generic-fields [initialPlace]="currentPlaces().place" (placeSelected)="onPlaceSelected('place', $event)" />
      <app-logistic-place-info [place]="currentPlaces().place" />
    }
  }

  @if (hasTypeSpecificContent()) {
    <app-divider class="m-1" />
  }

  <div class="grid m-0">
    <div class="col-6 p-0 pr-1 min-w-0">
      <div class="flex flex-column gap-1">
        <label for="logistic-start-date" class="logistic-details__date-label nt-text-muted text-sm flex align-items-end gap-1">
          <i class="pi pi-calendar text-sm"></i>{{ dateLabels().startLabel }}
        </label>
        <div class="flex align-items-center gap-1">
          <app-date-picker #startDatePicker [label]="dateLabels().startLabel" inputId="logistic-start-date" formControlName="startDate" class="flex-1 min-w-0 transparent-inputtext" />
          <app-time-picker-dialog #startTimePicker [label]="'Heure — ' + dateLabels().startLabel" formControlName="startTime" class="flex-none" />
        </div>
      </div>
    </div>
    <div class="col-6 p-0 pl-1 min-w-0">
      <div class="flex flex-column gap-1">
        <label for="logistic-end-date" class="logistic-details__date-label nt-text-muted text-sm flex align-items-end gap-1">
          <i class="pi pi-calendar-times text-sm"></i>{{ dateLabels().endLabel }}
        </label>
        <div class="flex align-items-center gap-1">
          <app-date-picker #endDatePicker [label]="dateLabels().endLabel" [minDate]="endDateMinDate()" inputId="logistic-end-date" formControlName="endDate" class="flex-1 min-w-0 transparent-inputtext" />
          <app-time-picker-dialog #endTimePicker [label]="'Heure — ' + dateLabels().endLabel" [minTime]="endTimeMinTime()" formControlName="endTime" class="flex-none" />
        </div>
      </div>
    </div>
  </div>

  <app-divider class="m-1" />

  <div class="flex flex-column gap-1">
    <label for="logistic-price-amount" class="nt-text-muted text-sm flex align-items-center gap-1">
      <i class="pi pi-euro text-sm"></i>Prix
    </label>
    <app-price-field #priceField inputId="logistic-price-amount" [currencyOptions]="currencyOptions" formControlName="price" class="w-full min-w-0" />
  </div>

  @if (showDeadline()) {
    <app-divider class="m-1" />
    <div class="flex flex-column gap-1 w-full min-w-0" formGroupName="booking">
      <label for="logistic-booking-deadline" class="text-xs flex align-items-center gap-1" [ngClass]="isDeadlineSoon() ? 'nt-text-warning' : 'nt-text-muted'">
        <i class="pi pi-calendar text-xs"></i>Deadline
      </label>
      <app-date-picker inputId="logistic-booking-deadline" formControlName="deadline" placeholder="Aucune deadline" class="w-max transparent-inputtext" />
    </div>
  }

  <app-divider class="m-1" />

  <div class="flex flex-column gap-2">
    <label for="logistic-notes" class="nt-text-muted text-sm flex align-items-center gap-1">
      <i class="pi pi-align-left text-xs"></i>Notes
    </label>
    <app-notes-field inputId="logistic-notes" formControlName="notes" placeholder="Ajouter une note…" class="w-full" />
  </div>
</form>
