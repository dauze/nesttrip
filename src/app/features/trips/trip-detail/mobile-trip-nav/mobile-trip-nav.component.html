<div #wrapper class="mobile-trip-nav" appOnboardingAnchor="mobile-nav-bar">
  <div #dayStrip class="day-strip" appOnboardingAnchor="mobile-day-strip">
    @if (!expanded()) {
      @for (tab of dayTabs(); track tab.id) {
        <button
          type="button"
          class="day-strip__chip"
          [class.day-strip__chip--active]="tab.id === activeId()"
          [attr.data-day-id]="tab.id"
          (click)="selectTab(tab)">
          {{ dayChipLabel(tab) }}
        </button>
      }
    } @else {
      @for (tab of generalTabs(); track tab.id) {
        <button
          type="button"
          class="day-strip__chip day-strip__chip--general"
          [class.day-strip__chip--active]="tab.id === activeId()"
          [attr.data-day-id]="tab.id"
          (click)="selectTab(tab)">
          <i [class]="generalTabIcon(tab)"></i>
          <span>{{ tab.label }}</span>
        </button>
      }
    }
  </div>

  <div class="bar" appOnboardingAnchor="mobile-nav-bar-primary" [attr.data-state]="expanded() ? 'expanded' : 'collapsed'">
    <div class="pill"></div>

    <button type="button" class="tab" [class.active]="expanded()" (click)="openGeneral()">
      <i class="pi pi-th-large"></i>
      <span class="label">Général</span>
    </button>

    <button
      type="button"
      class="tab day-badge"
      appOnboardingAnchor="mobile-day-badge"
      [class.active]="!expanded()"
      (click)="goBackToDay()"
      (dblclick)="openDayCalendar()">
      <i class="pi pi-calendar"></i>
      <span class="label">{{ activeDayLabel() }}</span>
    </button>
  </div>
</div>

<app-day-picker-sheet [tabs]="dayTabs()" (daySelected)="onDaySelected($event)" />
