<div
  class="day-picker-sheet fixed left-0 right-0 top-0 bottom-0"
  role="button"
  [attr.tabindex]="isVisible() ? 0 : -1"
  [class.day-picker-sheet--active]="isVisible()"
  [class.day-picker-sheet--expanded]="sheetExpanded()"
  (click)="onBackdropClick($event)"
  (keydown.enter)="onBackdropClick($event)">

  <div
    #sheet
    class="day-picker-sheet__sheet"
    [style.--day-picker-expand-duration.ms]="expandDurationMs()">

    <div class="day-picker-sheet__scroll">
      @for (group of monthGroups(); track group.label) {
        <div class="day-picker-sheet__month">
          <div class="day-picker-sheet__month-label nt-bg-content font-semibold text-sm">{{ group.label }}</div>
          <div class="flex flex-wrap gap-2 mb-2">
            @for (tab of group.tabs; track tab.id; let di = $index) {
              <app-button
                [rounded]="true"
                [text]="true"
                severity="secondary"
                class="day-picker-sheet__day"
                [class.day-picker-sheet__day--in]="sheetExpanded()"
                [style.transitionDelay.ms]="sheetExpanded() ? di * 25 : 0"
                (click)="onDayClick(tab)">
                <span class="flex flex-column align-items-center gap-0">
                  <span class="text-lg font-bold line-height-1">{{ tab.dayNumber }}</span>
                  <span class="text-xs uppercase line-height-1">{{ tab.weekday }}</span>
                </span>
              </app-button>
            }
          </div>
        </div>
      }
    </div>
  </div>
</div>
