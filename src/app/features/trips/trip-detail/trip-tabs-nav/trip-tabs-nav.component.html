<div
  class="trip-tabs-nav-root"
  [class.trip-tabs-nav-root--can-left]="canScrollLeft()"
  [class.trip-tabs-nav-root--can-right]="canScrollRight()">
  <!-- Navigation du débordement (desktop) : chevrons discrets affichés
       uniquement du côté où il reste des jours à défiler (voir
       canScrollLeft/Right). La scrollbar native est masquée (SCSS), des fondus
       latéraux signalent le débordement. -->
  <button
    type="button"
    class="trip-tabs-nav-arrow trip-tabs-nav-arrow--left"
    aria-label="Jours précédents"
    tabindex="-1"
    (click)="scrollByPage(-1)">
    <i class="pi pi-chevron-left" aria-hidden="true"></i>
  </button>
  <button
    type="button"
    class="trip-tabs-nav-arrow trip-tabs-nav-arrow--right"
    aria-label="Jours suivants"
    tabindex="-1"
    (click)="scrollByPage(1)">
    <i class="pi pi-chevron-right" aria-hidden="true"></i>
  </button>

  <div #tabsListRef class="app-tabs tabs-pop">
    <div class="app-tabs__list flex" role="tablist">
      @for (tab of tabs(); track tab.id; let i = $index) {
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="tab.id === activeId()"
          [attr.data-tab-id]="tab.id"
          class="app-tab flex flex-column align-items-center justify-content-center flex-1"
          [class.is-active]="tab.id === activeId()"
          [class.app-tab--day]="!!tab.dayNumber"
          [class.app-tab--general]="!tab.dayNumber"
          (click)="onTabClick(tab.id, i)">
          @if (tab.dayNumber) {
            <span class="day-tab flex flex-column align-items-center">
              <span class="day-tab__weekday nt-text-muted">
                <span class="day-tab__short">{{ tab.weekday }}</span>
                <span class="day-tab__full">{{ tab.weekdayFull }}</span>
              </span>
              <span class="day-tab__number">{{ tab.dayNumber }}</span>
              <span class="day-tab__month nt-text-muted">
                <span class="day-tab__short">{{ tab.month }}</span>
                <span class="day-tab__full">{{ tab.monthFull }}</span>
              </span>
            </span>
          } @else {
            <span class="general-tab">{{ tab.label }}</span>
          }
        </button>
      }
    </div>
  </div>
</div>
