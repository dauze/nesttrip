<div class="flex flex-column gap-4">

  <!-- Niveau d'assistance -->
  <div class="flex flex-column gap-2">
    <span class="font-medium">Niveau d'assistance</span>
    <app-select-button
      [options]="assistanceLevelOptions"
      [value]="preferences().assistanceLevel"
      (valueChange)="onAssistanceLevelChange($event)" />
  </div>

  <!-- Type de voyageurs -->
  <div class="flex flex-column gap-2">
    <span class="font-medium">Vous partez...</span>
    <app-select-button
      [options]="travelerTypeOptions"
      [value]="preferences().travelerType"
      (valueChange)="onTravelerTypeChange($event)" />
  </div>

  <!-- Rythme -->
  <div class="flex flex-column gap-2">
    <span class="font-medium">Rythme</span>
    <app-select-button
      [options]="paceOptions"
      [value]="preferences().pace"
      (valueChange)="onPaceChange($event)" />
  </div>

  <!-- Centres d'intérêt -->
  <div class="flex flex-column gap-2">
    <span class="font-medium">Centres d'intérêt</span>
    <button
      type="button"
      class="app-input-text block w-full text-left cursor-pointer ai-trip-preferences__interests-trigger"
      (click)="openInterestsDialog()">
      <span [class.ai-trip-preferences__placeholder]="preferences().interests.length === 0">
        {{ interestsLabel() }}
      </span>
    </button>
  </div>

  <!-- Plusieurs villes -->
  <div class="flex flex-column gap-2">
    <button type="button" class="flex align-items-center gap-2 ai-trip-preferences__toggle" (click)="onMultiCityToggle()">
      <app-checkbox [checked]="preferences().multiCity" />
      <span class="font-medium">Plusieurs villes ?</span>
    </button>

    @if (preferences().multiCity) {
      <div class="flex flex-column gap-2">
        @if (viewport.isMobile()) {
          <button
            type="button"
            class="app-input-text block w-full text-left cursor-pointer"
            (click)="onCityTriggerClick()">
            <span class="ai-trip-preferences__placeholder">Ajouter une ville...</span>
          </button>
        } @else {
          <app-autocomplete
            [suggestions]="cityPlaces()"
            [formControl]="cityAutocompleteControl"
            (searched)="onCitySearch($event)"
            (optionSelected)="onCitySelect($event)"
            [emptyMessage]="citySearching() ? 'Chargement...' : 'Aucun résultat trouvé'"
            [displayWith]="displayPlaceName"
            placeholder="Ajouter une ville..."
            class="w-full">
            <ng-template #item let-place>
              <span class="text-xl font-bold text-900 white-space-normal line-height-2">{{ place.name }}</span>
            </ng-template>
          </app-autocomplete>
        }

        @if (preferences().cities.length > 0) {
          <div class="flex flex-wrap gap-2">
            @for (city of preferences().cities; track city; let i = $index) {
              <app-chip [removable]="true" (remove)="removeCity(i)">{{ city }}</app-chip>
            }
          </div>
        }
      </div>
    }
  </div>

  <!-- Budget max -->
  <div class="flex flex-column gap-2">
    <label for="ai-budget-max" class="font-medium">Budget max des activités (€, optionnel)</label>
    <input
      appInputText
      type="number"
      id="ai-budget-max"
      min="0"
      class="w-full"
      [value]="preferences().budgetMaxEur ?? ''"
      (input)="onBudgetMaxInput($event)"
      placeholder="Ex : 300"
    />
  </div>

  <!-- Contexte libre -->
  <div class="flex flex-column gap-2">
    <label for="ai-free-text" class="font-medium">Dis-nous en plus</label>
    <textarea
      appTextarea
      id="ai-free-text"
      class="w-full"
      [value]="preferences().freeText"
      (input)="onFreeTextInput($event)"
      [attr.maxlength]="maxFreeTextLength"
      placeholder="Ex : je veux absolument voir le Colisée, pas de randonnée, budget serré, je commence à 11h, je me lève tard, pas de restaurant tous les soirs..."
      rows="3">
    </textarea>
  </div>

</div>
