<div class="interests-dialog flex flex-column">
  <div class="interests-dialog__row flex align-items-center justify-content-between gap-2 flex-shrink-0">
    <span class="interests-dialog__title">Centres d'intérêt</span>
    <app-button
      icon="pi pi-times"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      class="flex-shrink-0"
      aria-label="Fermer"
      (click)="cancel()" />
  </div>

  <div class="interests-dialog__list">
    @for (option of options; track option.value) {
      <button type="button" class="interests-dialog__option" (click)="toggle(option.value)">
        <app-checkbox [checked]="isSelected(option.value)" />
        <span class="interests-dialog__option-name">{{ option.label }}</span>
      </button>
    }
  </div>

  <div class="interests-dialog__footer flex-shrink-0">
    <app-button label="Valider" class="w-full" (click)="confirm()" />
  </div>
</div>
