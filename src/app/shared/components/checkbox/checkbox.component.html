<button
  type="button"
  class="app-checkbox inline-flex align-items-center justify-content-center"
  role="checkbox"
  [attr.aria-checked]="checked()"
  [class.app-checkbox--checked]="checked()"
  [disabled]="disabled()"
  (click)="toggle()">
  @if (checked()) {
    <i class="pi pi-check"></i>
  }
</button>
