<div class="app-slider flex align-items-center gap-2">
  <input
    #inputEl
    type="range"
    class="app-slider__input"
    [style.--app-slider-fill.%]="fillPercent()"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="value()"
    [disabled]="disabled()"
    (input)="onInput($any($event.target).value)"
    (blur)="onTouched?.()" />
  <span class="app-slider__value flex-shrink-0">{{ value() | number: '1.0-1' }}{{ unit() ? ' ' + unit() : '' }}</span>
</div>
