@if (activity(); as activity) {
  <div #cardContainer
       [class.not-dispatched]="isPlacedNowhere()"
       [class.card-lifted]="isBeingDragged()"
       [class.card-pending]="isPendingLift()">
    <app-panel
        [appSelectable]="selectableRef()" #sel="appSelectable"
        appLongPress (longPress)="sel.onLongPress()"
        [ngClass]="hideBookingMeta() ? 'trip' : 'trip booking ' + bookingMeta().className"
        [toggleable]="true"
        [instant]="panelInstant()"
        [(collapsed)]="collapsed">

      <div panelHeader class="flex align-items-center w-full">
        <app-checkbox
          class="nt-select-checkbox flex-shrink-0"
          [checked]="sel.isSelected()"
          (click)="sel.onCheckboxClick($event)"
        />
        <app-activity-header
          class="flex-1 min-w-0"
          [activity]="activity"
          [dayId] = "dayId()"
          [assignedPlacements] = "assignedPlacements()"
          [isPlacedNowhere]="isPlacedNowhere()"
          [hideBookingMeta]="hideBookingMeta()"
          (placeSelected)="onPlaceSelected($event)"
          (titleEdited)="onTitleChanged($event)"
          (placementClicked)="onPlacementClicked($event)"
          (timeClicked)="openStartTime()" />
      </div>

      @if (inDayList() && dayId(); as day) {
        <app-activity-form [tripId]="tripId()" [dayId]="day" [activity]="activity" />
        <app-divider class="m-1"/>
      }

      <app-activity-files [tripId]="tripId()" [activity]="activity" />

      <!-- L'appel a été simplifié ici -->
      <app-activity-google-info
        [activity]="activity"
        [dayId]="dayId()"
        [detailsState]="detailsState()"
        (expandDetails)="loadGoogleDetails($event)"/>
    </app-panel>
  </div>
}
