<form [formGroup]="form" class="min-w-0 compact-form">
  <div class="m-0 grid-label">
    <div class="grid m-0">
      
      <!-- TYPE -->
      <div class="col-6 p-0 min-w-0 overflow-hidden">
        <div class="flex flex-column gap-1 w-full min-w-0">
          <label for="activity-type" class="nt-text-muted text-sm flex align-items-center gap-1">
            <i class="pi pi-tag text-sm"></i>Type
          </label>
          <app-select #typeSelect id="activity-type" label="Type" [options]="activityTypeOptions" formControlName="type" class="w-full min-w-0 transparent-select" />
        </div>
      </div>
      
      <!-- RESA -->
      <div class="col-6 p-0 min-w-0 overflow-hidden" formGroupName="booking">
        <div class="flex flex-column gap-1 w-full min-w-0">
          <label for="booking-status" class="nt-text-muted text-sm flex align-items-center gap-1">
            <i class="pi pi-bookmark text-sm"></i>Résa
          </label>
          <app-select #bookingSelect id="booking-status" label="Résa" [ngClass]="'booking ' + bookingMeta().className" [options]="bookingStatusOptions" formControlName="status" class="w-full min-w-0 transparent-select" />
        </div>
      </div>
      
      <app-divider class="m-1"/>
  
      <!-- DEBUT -->
      <div class="col-6 p-0 min-w-0 overflow-hidden">
        <div class="flex flex-column gap-1 w-full min-w-0">
          <label for="start-time" class="nt-text-muted text-sm flex align-items-center gap-1">
            <i class="pi pi-calendar text-sm"></i>Début
          </label>
          <app-time-picker-dialog #startTimePicker id="start-time" label="Sélectionner l'heure de début" formControlName="startTime" />
        </div>
      </div>
      
      <!-- FIN -->
      <div class="col-6 p-0 min-w-0 overflow-hidden">
        <div class="flex flex-column gap-1 min-w-0">
          <label for="end-time" class="nt-text-muted text-sm flex align-items-center gap-1">
            <i class="pi pi-calendar-times text-sm"></i>Fin
          </label>
          <app-time-picker-dialog #endTimePicker id="end-time" label="Sélectionner l'heure de fin" formControlName="endTime" />
        </div>
      </div>
      
      <app-divider class="m-1"/>
      
      <!-- DUREE -->
      <div class="col-6 p-0 min-w-0 overflow-hidden">
        <div class="flex flex-column gap-1 min-w-0">
          <label for="duration-time" class="nt-text-muted text-sm flex align-items-center gap-1">
            <i class="pi pi-clock text-sm"></i>Durée
          </label>
          <app-time-picker-dialog id="duration-time" mode="duration" label="Sélectionner la durée" [formControl]="durationTimeControl" />
        </div>
      </div>
      
      <!-- PRIX -->
      <div class="col-6 p-0 min-w-0 overflow-hidden">
        <div class="flex flex-column gap-1 w-full min-w-0">
          <label for="price-amount" class="nt-text-muted text-sm flex align-items-center gap-1">
            <i class="pi pi-euro text-sm"></i>Prix
          </label>
          <app-price-field #priceField inputId="price-amount" [currencyOptions]="currencyOptions" formControlName="price" class="w-full min-w-0" />
        </div>
      </div>
      
      <!-- DEADLINE -->
      @if (showDeadline()) {
        <app-divider class="m-1" />
        <div class="col-12 p-0 min-w-0 overflow-hidden" formGroupName="booking">
          <div class="flex flex-column gap-1 w-full min-w-0">
            <label for="booking-deadline" class="text-xs flex align-items-center gap-1" [ngClass]="isDeadlineSoon() ? 'text-orange-500' : 'nt-text-muted'">
              <i class="pi pi-calendar text-xs"></i>Deadline
            </label>
            <app-date-picker inputId="booking-deadline" formControlName="deadline" placeholder="Aucune deadline" class="w-max transparent-inputtext" />
          </div>
        </div>
      }
    </div>
  </div>

  <app-divider class="m-1" />
  
  <!-- NOTES -->
  <div class="flex flex-column gap-2 mb-2">
    <label for="form-notes" class="nt-text-muted text-sm flex align-items-center gap-1">
      <i class="pi pi-pencil text-xs"></i>Notes
    </label>
    <app-notes-field inputId="form-notes" formControlName="notes" placeholder="Ajouter une note…" class="w-full" />
  </div>
</form>
