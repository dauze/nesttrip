<form [formGroup]="form" class="min-w-0 compact-form">
  <div class="m-0 grid-label">
    <div class="grid m-0">
      
      <!-- TYPE -->
      <div class="col-6 p-0 min-w-0 overflow-hidden">
        <div class="flex flex-column gap-1 w-full min-w-0">
          <label for="activity-type" class="nt-text-muted text-sm flex align-items-center gap-1">
            <i class="pi pi-tag text-sm"></i>Type
          </label>
          <app-select #typeSelect id="activity-type" label="Type" class="booking w-max min-w-0 transparent-select" [style.--booking-status-color]="'var(' + typeColorVar() + ')'" [options]="activityTypeOptions" formControlName="type" />
        </div>
      </div>
      
      <!-- RESA -->
      <div class="col-6 p-0 min-w-0 overflow-hidden" formGroupName="booking">
        <div class="flex flex-column gap-1 w-full min-w-0">
          <label for="booking-status" class="nt-text-muted text-sm flex align-items-center gap-1">
            <i class="pi pi-bookmark text-sm"></i>Statut
          </label>
          <app-select #bookingSelect id="booking-status" label="Statut" [options]="bookingStatusOptions" formControlName="status" class="w-max min-w-0 transparent-select" />
        </div>
      </div>
      
      <app-divider class="m-1"/>
  
      <!-- DEBUT -->
      <div class="col-6 p-0 min-w-0 overflow-hidden">
        <div class="flex flex-column gap-1 w-full min-w-0">
          <label for="start-time" class="nt-text-muted text-sm flex align-items-center gap-1">
            <i class="pi pi-calendar text-sm"></i>Début
          </label>
          <app-time-picker-dialog #startTimePicker id="start-time" label="Heure de début" formControlName="startTime" />
        </div>
      </div>
      
      <!-- FIN -->
      <div class="col-6 p-0 min-w-0 overflow-hidden">
        <div class="flex flex-column gap-1 min-w-0">
          <label for="end-time" class="nt-text-muted text-sm flex align-items-center gap-1">
            <i class="pi pi-calendar-times text-sm"></i>Fin
          </label>
          <div class="flex align-items-center gap-2 min-w-0">
            <app-time-picker-dialog #endTimePicker id="end-time" label="Heure de fin" formControlName="endTime"
              [dayOffsetReference]="formValue().startTime" [dayOffset]="formValue().endDayOffset"
              (dayOffsetChange)="onEndDayOffsetChange($event)" />
            @if (formValue().endDayOffset >= 1) {
              <!--
                Lecture seule ici à dessein (pas de flèches) : le réglage se
                fait désormais dans le dialog "Heure de fin" lui-même (voir
                TimePickerClockComponent, ROADMAP.md "UX / Interactions") — ce
                badge ne fait que rappeler la valeur et ramener sur le même
                éditeur que le clic sur l'heure.
              -->
              <button type="button" class="end-day-offset-badge flex-shrink-0" (click)="openEndTimeEditor()">
                J+{{ formValue().endDayOffset }}
              </button>
            }
          </div>
        </div>
      </div>

      <app-divider class="m-1"/>
      
      <!-- DUREE -->
      <div class="col-6 p-0 min-w-0 overflow-hidden">
        <div class="flex flex-column gap-1 min-w-0">
          <label for="duration-time" class="nt-text-muted text-sm flex align-items-center gap-1">
            <i class="pi pi-clock text-sm"></i>Durée
          </label>
          <app-time-picker-dialog id="duration-time" mode="duration" label="Durée" [formControl]="durationTimeControl" />
        </div>
      </div>
      
      <!-- PRIX -->
      <div class="col-6 p-0 min-w-0 overflow-hidden">
        <div class="flex flex-column gap-1 w-full min-w-0">
          <label for="price-amount" class="nt-text-muted text-sm flex align-items-center gap-1">
            <i class="pi pi-euro text-sm"></i>Prix
          </label>
          <app-price-field #priceField inputId="price-amount" [currencyOptions]="currencyOptions" formControlName="price" class="w-max min-w-0" />
        </div>
      </div>
      
      <!-- DEADLINE -->
      @if (showDeadline()) {
        <app-divider class="m-1" />
        <div class="col-12 p-0 min-w-0 overflow-hidden" formGroupName="booking">
          <div class="flex flex-column gap-1 w-full min-w-0">
            <label for="booking-deadline" class="text-xs flex align-items-center gap-1" [ngClass]="isDeadlineSoon() ? 'nt-text-warning' : 'nt-text-muted'">
              <i class="pi pi-calendar text-xs"></i>Deadline
            </label>
            <app-date-picker inputId="booking-deadline" formControlName="deadline" placeholder="Aucune deadline" class="w-max transparent-inputtext" />
          </div>
        </div>
      }
    </div>
  </div>

  <app-divider class="m-1" />

  <!-- NOTES -->
  <div class="flex flex-column gap-1">
    <label for="form-notes" class="nt-text-muted text-sm flex align-items-center gap-1">
      <i class="pi pi-pencil text-xs"></i>Notes
    </label>
    <app-notes-field inputId="form-notes" formControlName="notes" placeholder="Ajouter une note…" class="w-full" />
  </div>

  <app-divider class="m-1" />

  <!-- LISTE(S) LIÉE(S) -->
  <div class="flex flex-column gap-1">
    <span class="nt-text-muted text-sm flex align-items-center gap-1">
      <i class="pi pi-clipboard text-xs"></i>Liste
    </span>
    <div class="flex align-items-center gap-1 flex-wrap">
      @for (item of linkedListItems(); track item.id) {
        <app-chip
          icon="pi pi-clipboard"
          [removable]="true"
          (click)="navigateToLinkedList(item.id)"
          (remove)="unlinkList(item.id)"
          class="nt-bg-subtle text-sm cursor-pointer">
          {{ item.title.trim() || '(Sans titre)' }}
        </app-chip>
      }
      <app-button
        label="Lier une liste"
        icon="pi pi-link"
        [text]="true"
        size="small"
        severity="secondary"
        (click)="openLinkListDialog()"
      />
    </div>
  </div>
</form>
