<div class="title-edit-dialog flex flex-column">
  <div class="title-edit-dialog__row flex align-items-center justify-content-between gap-2 flex-shrink-0">
    <span class="title-edit-dialog__title">{{ headerTitle }}</span>
    <app-button
      icon="pi pi-times"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      class="flex-shrink-0"
      aria-label="Fermer"
      (click)="cancel()" />
  </div>

  <div class="title-edit-dialog__input-row flex-shrink-0">
    <input
      #inputEl
      type="text"
      class="title-edit-dialog__input"
      [value]="inputValue()"
      [placeholder]="placeholder"
      [attr.maxlength]="maxLength"
      (input)="onInput($any($event.target).value)"
      (keydown.enter)="validate()" />
  </div>

  <div class="title-edit-dialog__list">
    @if (places().length > 0) {
      @for (place of places(); track place.placeId) {
        <button type="button" class="title-edit-dialog__option" (click)="selectPlace(place)">
          <span class="title-edit-dialog__option-name">{{ displayName(place) }}</span>
          <span class="title-edit-dialog__option-address">{{ place.address }}</span>
        </button>
      }
    } @else if (searching()) {
      <div class="title-edit-dialog__empty">Chargement...</div>
    } @else if (inputValue().trim().length > 0) {
      <div class="title-edit-dialog__empty">Aucun résultat trouvé</div>
    }
  </div>

  <div class="title-edit-dialog__footer flex align-items-center justify-content-end gap-2 flex-shrink-0">
    <app-button label="Annuler" [outlined]="true" severity="secondary" (click)="cancel()" />
    <app-button label="OK" [disabled]="inputValue().trim().length === 0" (click)="validate()" />
  </div>
</div>
