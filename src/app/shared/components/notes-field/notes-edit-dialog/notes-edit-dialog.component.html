<div class="notes-edit-dialog flex flex-column">
  <div class="notes-edit-dialog__row flex align-items-center justify-content-between gap-2 flex-shrink-0">
    <span class="notes-edit-dialog__title">{{ data.title }}</span>
    <app-button
      icon="pi pi-times"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      class="flex-shrink-0"
      aria-label="Fermer"
      (click)="cancel()" />
  </div>

  <textarea
    #textareaEl
    appTextarea
    class="notes-edit-dialog__textarea"
    [value]="value()"
    [placeholder]="data.placeholder"
    [attr.maxlength]="maxLength"
    (input)="onInput($any($event.target).value)"></textarea>

  <div class="notes-edit-dialog__counter flex-shrink-0" [class.notes-edit-dialog__counter--limit]="value().length >= maxLength">
    {{ value().length }}/{{ maxLength }}
  </div>

  <div class="notes-edit-dialog__footer nt-footer-actions align-items-center justify-content-end flex-shrink-0">
    <app-button
      label="Annuler"
      [outlined]="!viewport.isMobile()"
      severity="secondary"
      [size]="viewport.isMobile() ? 'large' : 'normal'"
      (click)="cancel()" />
    <app-button label="OK" [size]="viewport.isMobile() ? 'large' : 'normal'" (click)="confirm()" />
  </div>
</div>
