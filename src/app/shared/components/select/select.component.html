<button
  type="button"
  class="app-select__trigger flex align-items-center justify-content-between gap-2 w-full"
  [class.app-select__trigger--open]="isOpen()"
  [disabled]="isDisabled()"
  (click)="toggle()">
  <span class="app-select__label" [class.app-select__label--placeholder]="!selectedLabel()">
    {{ selectedLabel() || placeholder() }}
  </span>
  <i class="pi pi-chevron-down app-select__chevron"></i>
</button>

<ng-template #panel>
  <div class="app-select-panel">
    @if (viewport.isMobile()) {
      <input
        #mobileSearchInput
        type="text"
        class="app-input-text app-select-panel__search"
        [value]="mobileSearchTerm()"
        (input)="mobileSearchTerm.set($any($event.target).value)"
        placeholder="Rechercher..." />
    }
    <div class="app-select-panel__list">
      @for (option of filteredOptions(); track option.label) {
        <button
          type="button"
          class="app-select-panel__option"
          [class.app-select-panel__option--selected]="option.value === value()"
          (click)="selectOption(option)">
          {{ option.label }}
        </button>
      }
      @if (!filteredOptions().length) {
        <div class="app-select-panel__empty">Aucun résultat</div>
      }
    </div>
  </div>
</ng-template>
