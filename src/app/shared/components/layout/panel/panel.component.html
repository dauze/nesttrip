@if (!bare() && !footerToggle() && !noHeader()) {
  <div class="app-panel__header flex align-items-center justify-content-between gap-2">
    <div
      class="app-panel__header-content flex align-items-center gap-2"
      [class.app-panel__header-content--toggleable]="toggleable()"
      [attr.tabindex]="toggleable() ? 0 : null"
      (click)="onHeaderContentClick($event)"
      (keydown.enter)="onHeaderContentClick($event)"
      (keydown.space)="onHeaderContentClick($event)">
      @if (header()) {
        <span>{{ header() }}</span>
      }
      <ng-content select="[panelHeader]" />
    </div>
    @if (toggleable()) {
      <button
        type="button"
        class="app-panel__toggle inline-flex align-items-center justify-content-center flex-shrink-0"
        [attr.aria-expanded]="!collapsed()"
        aria-label="Afficher/masquer"
        (click)="toggle()">
        <i class="pi" [class.pi-plus]="collapsed()" [class.pi-minus]="!collapsed()"></i>
      </button>
    }
  </div>
}
<div
  #content
  class="app-panel__content"
  [class.app-panel__content--instant]="instant() || dragPullPx() !== null"
  [style.max-height]="dragPullPx() !== null ? dragMaxHeightPx() + 'px' : (collapsed() ? '0px' : (maxHeightPx() ? maxHeightPx() + 'px' : 'none'))">
  <div class="app-panel__content-inner">
    <ng-content />
  </div>
</div>
@if (footerToggle()) {
  <button
    type="button"
    class="app-panel__footer-toggle flex flex-column align-items-center justify-content-center w-full"
    [attr.aria-expanded]="!collapsed()"
    aria-label="Afficher/masquer"
    (click)="toggle()">
    <ng-content select="[panelFooter]" />
  </button>
}
