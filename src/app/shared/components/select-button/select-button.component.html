@if (variant() === 'subtle') {
  <span class="app-select-button__track"></span>
}
@if (variant() === 'subtle' && thumbRect(); as rect) {
  <span
    class="app-select-button__thumb"
    [style.left.px]="rect.left"
    [style.width.px]="rect.width"></span>
}
@for (option of options(); track option.value) {
  <button
    #itemEl
    type="button"
    class="app-select-button__item flex align-items-center justify-content-center gap-2"
    [class.app-select-button__item--active]="option.value === value()"
    (click)="select(option)">
    @if (option.icon) {
      <i [class]="option.icon"></i>
    }
    @if (option.label) {
      <span>{{ option.label }}</span>
    }
  </button>
}
