<div class="dialog-frame flex flex-column">
  @if (header() || showCloseButton()) {
    <header class="dialog-frame__header flex align-items-center justify-content-between gap-2">
      <h2 class="dialog-frame__title">{{ header() }}</h2>
      @if (showCloseButton()) {
        <button
          type="button"
          class="dialog-frame__close inline-flex align-items-center justify-content-center"
          aria-label="Fermer"
          (click)="closeRequested.emit()">
          <i class="pi pi-times"></i>
        </button>
      }
    </header>
  }

  <div class="dialog-frame__content">
    <ng-content />
  </div>

  <footer class="dialog-frame__footer">
    <ng-content select="[dialogFooter]" />
  </footer>
</div>
