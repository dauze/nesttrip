<ng-template #panel>
  <div class="app-menu-panel flex flex-column">
    @if (viewport.isMobile() && title()) {
      <div class="app-menu-panel__title">{{ title() }}</div>
    }
    <ng-content select="[menuTop]" />
    @for (group of items(); track $index) {
      @if (group.items) {
        @if (group.label) {
          <div class="app-menu-panel__group-label">{{ group.label }}</div>
        }
        @for (item of group.items; track item.label) {
          <button
            type="button"
            class="app-menu-panel__item flex align-items-center gap-2 w-full"
            [class.app-menu-panel__item--selected]="item.selected"
            [attr.aria-pressed]="item.selected ?? null"
            (click)="runCommand(item)">
            @if (item.icon) {
              <i [class]="item.icon"></i>
            }
            <span>{{ item.label }}</span>
          </button>
        }
      } @else {
        <button
          type="button"
          class="app-menu-panel__item flex align-items-center gap-2 w-full"
          [class.app-menu-panel__item--selected]="group.selected"
          [attr.aria-pressed]="group.selected ?? null"
          (click)="runCommand(group)">
          @if (group.icon) {
            <i [class]="group.icon"></i>
          }
          <span>{{ group.label }}</span>
        </button>
      }
    }
  </div>
</ng-template>
