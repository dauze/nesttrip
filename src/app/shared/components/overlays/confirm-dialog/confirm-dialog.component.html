<app-dialog-frame [header]="data.header || 'Confirmation'" [showCloseButton]="false">
  <div class="confirm-dialog__body flex align-items-start">
    @if (data.icon) {
      <i class="confirm-dialog__icon" [class]="data.icon"></i>
    }
    <p class="confirm-dialog__message">{{ data.message }}</p>
  </div>

  <div dialogFooter class="nt-footer-actions justify-content-end">
    @if (!data.singleButton) {
      <app-button
        [outlined]="!viewport.isMobile()"
        severity="secondary"
        [size]="viewport.isMobile() ? 'large' : 'normal'"
        [label]="data.rejectLabel || 'Non'"
        (click)="reject()" />
    }
    <app-button [size]="viewport.isMobile() ? 'large' : 'normal'" [label]="data.acceptLabel || 'Oui'" (click)="accept()" />
  </div>
</app-dialog-frame>
